# Auto-tagging rules for the daily report. First matching rule wins.
# Columns (tab-separated): regex <TAB> company <TAB> project (project may be empty)
# The regex is matched against "<area> <title> <jira> <PR urls>" (ERE, case-insensitive).
# Copy this file to $DAILY_REPORT_DIR/tags.conf to customise. Explicit tags (add.sh -c/-p) always win.
# Example:  my-org/website|website<TAB>work<TAB>website
.	work	
